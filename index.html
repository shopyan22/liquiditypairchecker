<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solana Liquidity Pair Checker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        h1 {
            text-align: center;
            margin: 20px 0;
            font-size: 24px;
        }
        .container {
            max-width: 780px;
            margin: 20px auto;
            padding: 20px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            vertical-align: middle;
        }

        th {
            background-color: #f2f2f2;
            font-weight: bold;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        /* Gaya untuk alamat yang dipotong */
        .address-link {
            font-family: monospace;
            cursor: pointer;
            text-decoration: underline;
            color: #0066cc;
        }

        .error {
            color: #dc3545;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
        }
        .message {
            color: #28a745;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
            font-size: 16px;
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            font-size: 16px;
            flex: 1;
            max-width: 150px;
        }

        .fetch-btn {
            background-color: #28a745;
        }
        .fetch-btn:hover { background-color: #218838; }

        .reset-btn {
            background-color: #dc3545;
        }
        .reset-btn:hover { background-color: #c82333; }

        @media (max-width: 600px) {
            h1 { font-size: 20px; }
            .container { padding: 15px; margin: 10px; }
            
            th, td {
                padding: 10px 8px;
                font-size: 14px;
            }

            button {
                width: 100%;
                max-width: none;
            }
            
            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Solana Liquidity Pair Checker</h1>
        
        <div class="input-group">
            <input type="text" id="tokenAddress" placeholder="Masukkan Alamat Token Solana" value="">
        </div>

        <div class="button-group">
            <button class="fetch-btn" onclick="fetchData()">Check Pairs</button>
            <button class="reset-btn" onclick="resetData()">Reset</button>
        </div>

        <div id="message" class="message"></div>
        <div id="error" class="error"></div>

        <div class="table-responsive">
            <table id="dataTable">
                <thead>
                    <tr>
                        <th>Address</th>
                        <th>DexId</th>
                        <th>Price USD</th>
                        <th>Price Chg (24h)</th>
                        <th>Liquidity (USD)</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script>
        // Fungsi pembantu untuk memotong teks di bagian tengah
        function shortenAddress(address) {
            if (!address) return 'N/A';
            if (address.length <= 10) return address;
            return address.substring(0, 5) + '...' + address.substring(address.length - 5);
        }

        async function fetchData() {
            const tokenAddress = document.getElementById('tokenAddress').value.trim();
            const messageElement = document.getElementById('message');
            const errorElement = document.getElementById('error');
            const tableBody = document.querySelector('#dataTable tbody');

            messageElement.textContent = '';
            errorElement.textContent = '';
            tableBody.innerHTML = '';

            if (!tokenAddress) {
                errorElement.textContent = '⚠️ Harap masukkan alamat token terlebih dahulu.';
                return;
            }

            messageElement.textContent = '⏳ Sedang memeriksa data likuiditas...';

            try {
                const response = await fetch(`https://api.dexscreener.com/latest/dex/search?q=${tokenAddress}`);
                const data = await response.json();

                messageElement.textContent = '';

                if (data.pairs && Array.isArray(data.pairs) && data.pairs.length > 0) {
                    
                    const filteredPairs = data.pairs.filter(pair => 
                        pair.baseToken?.address?.toLowerCase() === tokenAddress.toLowerCase()
                    );

                    if (filteredPairs.length === 0) {
                        errorElement.textContent = '❌ Tidak ditemukan liquidity pair yang cocok untuk alamat token ini.';
                        return;
                    }

                    filteredPairs.sort((a, b) => {
                        const liqB = b.liquidity?.usd || 0;
                        const liqA = a.liquidity?.usd || 0;
                        return liqB - liqA;
                    });

                    filteredPairs.forEach(pair => {
                        const row = document.createElement('tr');
                        
                        const pairAddress = pair.pairAddress || 'N/A';
                        const dexId = pair.dexId || 'N/A';
                        const priceUsd = pair.priceUsd ? parseFloat(pair.priceUsd).toFixed(6) : 'N/A';
                        const priceChange = pair.priceChange?.h24 ?? 'N/A';
                        const liquidity = pair.liquidity?.usd ? `$${pair.liquidity.usd.toLocaleString('en-US')}` : 'N/A';

                        let changeClass = '';
                        if (priceChange > 0) changeClass = 'style="color: green;"';
                        if (priceChange < 0) changeClass = 'style="color: red;"';

                        // Memotong alamat di sini memakai fungsi shortenAddress
                        const displayedAddress = shortenAddress(pairAddress);

                        row.innerHTML = `
                            <td>
                                <span class="address-link" title="Klik untuk salin" onclick="navigator.clipboard.writeText('${pairAddress}'); alert('Alamat disalin!');">${displayedAddress}</span>
                            </td>
                            <td>${dexId}</td>
                            <td>$${priceUsd}</td>
                            <td ${changeClass}>${priceChange}%</td>
                            <td>${liquidity}</td>
                        `;
                        
                        tableBody.appendChild(row);
                    });
                    messageElement.textContent = `✅ Berhasil memuat ${filteredPairs.length} liquidity pair.`;
                } else {
                    errorElement.textContent = '❌ Tidak ada data pair ditemukan untuk token ini.';
                }
            } catch (error) {
                console.error(error);
                errorElement.textContent = '⚠️ Terjadi kesalahan koneksi. Silakan coba beberapa saat lagi.';
            }
        }

        function resetData() {
            document.getElementById('tokenAddress').value = '';
            document.querySelector('#dataTable tbody').innerHTML = '';
            document.getElementById('message').textContent = '';
            document.getElementById('error').textContent = '';
        }
    </script>
</body>
</html>
